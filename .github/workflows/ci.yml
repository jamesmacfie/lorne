name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-placeholder-auth-secret-with-at-least-32-bytes
      OPENAI_CREDENTIAL_ENCRYPTION_KEY_V1: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run validate
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run db:migrate:local
      - run: pnpm run test:e2e
